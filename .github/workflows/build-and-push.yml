name: Build and Push Gateway Image

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'Dockerfile.gateway'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'app/**'
      - 'Dockerfile.gateway'
      - 'requirements.txt'

permissions:
  contents: read
  id-token: write
  security-events: write   # needed if you want to upload results to GitHub Security

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: vllm-sara
      REGION: us-east1
      REPO: vllm-rag-bot
      IMAGE: gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/14727602944/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-actions@vllm-sara.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:latest"

          docker build -f Dockerfile.gateway -t $IMAGE_URI -t $IMAGE_LATEST .
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "IMAGE_LATEST=$IMAGE_LATEST" >> $GITHUB_ENV

      # -----------------------------
      # Security Scanning (Trivy)
      # -----------------------------
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: 'table'
          exit-code: '1'          # fail the job on findings
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Run Trivy (SARIF upload for GitHub Security tab)
        uses: aquasecurity/trivy-action@0.28.0
        if: always()
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      # -----------------------------
      # Push only if scan passed
      # -----------------------------
      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker push $IMAGE_URI
          docker push $IMAGE_LATEST
          echo "Pushed: $IMAGE_URI"
